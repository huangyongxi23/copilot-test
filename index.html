<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕海边骑单车</title>
<style>
  html,body{margin:0;height:100%;background:#8fd8ff;overflow:hidden;font-family:sans-serif}
  svg{width:100%;height:100%;display:block}
  .wheel{animation:spin 1s linear infinite;transform-box:fill-box;transform-origin:center}
  .crank{animation:spin 1s linear infinite;transform-box:fill-box;transform-origin:center}
  .pedal{animation:counter 1s linear infinite;transform-box:fill-box;transform-origin:center}
  .legA{animation:legA 1s linear infinite}
  .legB{animation:legB 1s linear infinite}
  .bob{animation:bob .5s ease-in-out infinite alternate}
  .head{animation:head 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:20% 90%}
  .scroll1{animation:scroll 6s linear infinite}
  .scroll2{animation:scroll 14s linear infinite}
  .ground{animation:scroll 1s linear infinite}
  .cloud{animation:cloud 30s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes counter{to{transform:rotate(-360deg)}}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
  @keyframes head{from{transform:rotate(-3deg)}to{transform:rotate(4deg)}}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-400px)}}
  @keyframes cloud{from{transform:translateX(900px)}to{transform:translateX(-300px)}}
</style>
</head>
<body>
<svg viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
  <defs>
    <g id="spokes" stroke="#555" stroke-width="1.5">
      <line x1="-48" y1="0" x2="48" y2="0"/><line x1="0" y1="-48" x2="0" y2="48"/>
      <line x1="-34" y1="-34" x2="34" y2="34"/><line x1="-34" y1="34" x2="34" y2="-34"/>
    </g>
  </defs>

  <!-- sun & clouds -->
  <circle cx="680" cy="70" r="36" fill="#ffd84d"/>
  <g class="cloud" fill="#fff" opacity=".9">
    <ellipse cx="0" cy="80" rx="50" ry="16"/><ellipse cx="25" cy="68" rx="30" ry="16"/>
  </g>
  <g class="cloud" fill="#fff" opacity=".8" style="animation-delay:-14s">
    <ellipse cx="0" cy="140" rx="60" ry="18"/><ellipse cx="-20" cy="128" rx="30" ry="16"/>
  </g>

  <!-- sea -->
  <rect y="250" width="800" height="110" fill="#2e9fd8"/>
  <rect y="250" width="800" height="14" fill="#7fd0f0"/>
  <g class="scroll1" stroke="#fff" stroke-width="3" fill="none" opacity=".8" stroke-linecap="round">
    <g id="waves"><path d="M20 285 q10 -8 20 0 t20 0"/><path d="M180 305 q10 -8 20 0 t20 0"/><path d="M300 280 q10 -8 20 0 t20 0"/><path d="M90 340 q10 -8 20 0 t20 0"/><path d="M260 335 q10 -8 20 0 t20 0"/></g>
    <use href="#waves" x="400"/><use href="#waves" x="800"/><use href="#waves" x="1200"/>
  </g>
  <!-- sailboat -->
  <g class="cloud" style="animation-duration:60s">
    <path d="M0 262 H50 L42 276 H8Z" fill="#8a5a2b"/><rect x="24" y="222" width="3" height="40" fill="#555"/>
    <path d="M27 224 L27 258 L48 258Z" fill="#fff"/><path d="M23 230 L23 258 L8 258Z" fill="#ffd0d0"/>
  </g>
  <!-- beach sand -->
  <path d="M0 345 Q200 325 400 345 T800 345 V450 H0Z" fill="#f4d58d"/>
  <rect y="372" width="800" height="80" fill="#f4d58d"/>
  <g class="scroll1" fill="none" stroke="#fff" stroke-width="5" opacity=".7" stroke-linecap="round">
    <path d="M0 352 q50 -10 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0"/>
  </g>
  <!-- boardwalk road -->
  <rect y="388" width="800" height="62" fill="#c9a26b"/>
  <g class="ground" stroke="#a07a45" stroke-width="3" stroke-dasharray="3 37">
    <line x1="0" y1="395" x2="1300" y2="395" stroke-width="12"/>
    <line x1="0" y1="420" x2="1300" y2="420" stroke-width="12"/>
    <line x1="0" y1="445" x2="1300" y2="445" stroke-width="12"/>
  </g>
  <!-- palm trees, umbrellas -->
  <g class="scroll1">
    <g id="palm">
      <path d="M62 375 Q70 340 64 312" stroke="#8a5a2b" stroke-width="8" fill="none" stroke-linecap="round"/>
      <g fill="#2e9a4a"><ellipse cx="42" cy="312" rx="26" ry="7" transform="rotate(-25 42 312)"/><ellipse cx="86" cy="312" rx="26" ry="7" transform="rotate(25 86 312)"/>
      <ellipse cx="64" cy="302" rx="8" ry="24"/><ellipse cx="46" cy="324" rx="22" ry="6" transform="rotate(25 46 324)"/><ellipse cx="82" cy="324" rx="22" ry="6" transform="rotate(-25 82 324)"/></g>
    </g>
    <g id="umb"><rect x="161" y="345" width="3" height="30" fill="#555"/><path d="M135 347 Q162 318 190 347Z" fill="#ff5a5a"/></g>
    <use href="#palm" x="400"/><use href="#umb" x="400"/><use href="#palm" x="800"/><use href="#umb" x="800"/>
    <use href="#palm" x="1200"/>
  </g>

  <!-- pelican + bike -->
  <g class="bob">
    <!-- rear wheel -->
    <g transform="translate(270 335)">
      <g class="wheel"><circle r="50" fill="none" stroke="#222" stroke-width="6"/><use href="#spokes"/></g>
    </g>
    <!-- front wheel -->
    <g transform="translate(510 335)">
      <g class="wheel"><circle r="50" fill="none" stroke="#222" stroke-width="6"/><use href="#spokes"/></g>
    </g>
    <!-- frame -->
    <g stroke="#d33" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M270 335 L360 335 L335 255 L270 335"/>
      <path d="M335 255 L460 255 L360 335"/>
      <path d="M460 255 L510 335"/>
      <path d="M460 255 L455 235 M440 235 L475 235" stroke="#333"/>
      <path d="M335 255 L330 235 M312 235 L350 235" stroke="#333"/>
    </g>
    <!-- crank & pedals -->
    <g transform="translate(360 335)">
      <g class="crank"><line x1="-24" y1="0" x2="24" y2="0" stroke="#333" stroke-width="6" stroke-linecap="round"/>
        <g transform="translate(24 0)"><rect class="pedal" x="-8" y="-3" width="16" height="6" fill="#222"/></g>
        <g transform="translate(-24 0)"><rect class="pedal" x="-8" y="-3" width="16" height="6" fill="#222"/></g>
      </g>
    </g>

    <!-- legs (orange) -->
    <g stroke="#f5a623" stroke-width="7" stroke-linecap="round" fill="none">
      <path class="legB" d="M335 225 L355 285 L336 335"/>
      <path class="legA" d="M335 225 L355 285 L384 335"/>
    </g>

    <!-- body -->
    <ellipse cx="345" cy="205" rx="52" ry="38" fill="#fff" stroke="#ccc" stroke-width="2" transform="rotate(-20 345 205)"/>
    <!-- wing -->
    <path d="M335 195 Q380 185 440 240 Q390 250 345 225Z" fill="#e8eef2" stroke="#aab" stroke-width="2"/>
    <!-- tail -->
    <path d="M300 205 L265 215 L300 225Z" fill="#cfd8dc"/>
    <!-- neck + head -->
    <g class="head">
      <path d="M375 185 Q400 150 385 120 Q380 105 395 100" stroke="#fff" stroke-width="16" fill="none" stroke-linecap="round"/>
      <circle cx="400" cy="98" r="17" fill="#fff" stroke="#ccc" stroke-width="2"/>
      <circle cx="404" cy="93" r="3.5" fill="#222"/>
      <!-- beak -->
      <path d="M412 94 L490 104 L412 112Z" fill="#ffb74d" stroke="#e08a00" stroke-width="2"/>
      <path d="M412 112 Q445 140 485 106 L412 106Z" fill="#ff9800" stroke="#e08a00" stroke-width="2"/>
    </g>
    <!-- arm to handlebar -->
    <path d="M400 205 L455 235" stroke="#e8eef2" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
</body>
</html>
